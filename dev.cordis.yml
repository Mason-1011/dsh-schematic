# Dev patch for dsh-schematic. The plugin itself is mounted BY NAME from the
# shared profile patch (~/.dsh/profiles/web/cordis.patch.yml inserts
# {id: schematic, name: dsh-schematic}); name resolution anchors at the
# profile directory, where the dev checkout is symlinked:
#   ln -sfn ~/Projects/dsh-schematic ~/.dsh/profiles/web/node_modules/dsh-schematic
# Do NOT also insert it here — duplicate loader entry ids fail the whole tree.
# This patch only overrides the port: 3081 dev vs the long-lived 3080.
# Usage, from the harness checkout:
#   node --import tsx/esm apps/cli/src/bin.ts --profile web --patch <this file>
- id: webserver
  config:
    host: 127.0.0.1
    port: 3081
